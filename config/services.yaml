# config/services.yaml

parameters:
    activities_directory: '%kernel.project_dir%/public/uploads/activities'
    images_directory: 'C:/shared_uploads'
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    gemini_api_key_4: '%env(GEMINI_API_KEY4)%'
    openrouter_api_key: '%env(OPENROUTER_API_KEY)%'
    recaptcha_site_key: '%env(RECAPTCHA_SITE_KEY)%'
    recaptcha_secret_key: '%env(RECAPTCHA_SECRET_KEY)%'
    recaptcha_v2_site_key: '%env(RECAPTCHA_V2_SITE_KEY)%'
    recaptcha_v2_secret_key: '%env(RECAPTCHA_V2_SECRET_KEY)%'
    unsplash_access_key: '%env(UNSPLASH_ACCESS_KEY)%'

    mistral_api_key: '%env(MISTRAL_API_KEY)%'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: true 
        
   
   

    # default configuration for services in *this* file
    

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\CloudinaryService:
        public: true

    App\Service\AyrshareService:
        public: true

    App\Service\UserRiskAnalysisService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $geminiApiKey2: '%env(GEMINI_API_KEY2)%'
            $openRouterApiKey: '%env(OPENROUTER_API_KEY)%'

    App\UserMailerBundle\Service\UserMailerService:
        autowire: true
        autoconfigure: true
        public: true

    App\UserAvatarBundle\Service\AvatarService:
        autowire: true
        autoconfigure: true
        public: true

    App\UserAvatarBundle\Twig\AvatarExtension:
        autowire: true
        autoconfigure: true
        tags: ['twig.extension']

    App\Controller\PaymentController:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Service\AiDescriptionService:
        arguments:
            $openRouterApiKey: '%openrouter_api_key%'


    App\SmsBundle\Service\SmsSender:
        arguments:
            $sid: '%env(TWILIO_SID)%'
            $token: '%env(TWILIO_TOKEN)%'
            $from: '%env(TWILIO_FROM)%'
    App\Service\KnapsackOptimizerService: ~

    App\Service\ChatbotService:
        arguments:
            $geminiApiKey4: '%env(GEMINI_API_KEY4)%'

    App\Service\MistralRecommendationService:
        arguments:
            $mistralApiKey: '%mistral_api_key%'
