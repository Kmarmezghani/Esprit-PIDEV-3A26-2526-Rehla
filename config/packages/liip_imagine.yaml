liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: 'media/cache'

    loaders:
        default:
            filesystem:
                data_root: '%kernel.project_dir%/public'

    driver: gd

    filter_sets:
        # Photo de profil – miniature carrée 80×80 (sidebar, navbar, listes)
        profile_thumb:
            quality: 85
            filters:
                thumbnail:
                    size: [80, 80]
                    mode: outbound

        # Photo de profil – moyenne 150×150 (page profil, fiche admin)
        profile_medium:
            quality: 90
            filters:
                thumbnail:
                    size: [150, 150]
                    mode: outbound

        # Photo de profil – grande 300×300 (page profil plein écran)
        profile_large:
            quality: 92
            filters:
                thumbnail:
                    size: [300, 300]
                    mode: outbound

        # Miniature activité – 400×250 (cartes d'activités)
        activity_card:
            quality: 85
            filters:
                thumbnail:
                    size: [400, 250]
                    mode: outbound

        # Miniature activité – petite 120×80 (tableaux admin)
        activity_thumb:
            quality: 80
            filters:
                thumbnail:
                    size: [120, 80]
                    mode: outbound